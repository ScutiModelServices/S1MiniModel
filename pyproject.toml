[project]
name = "s1mini-service"
description = "One HTTP service that runs the S1-mini speech-to-text normalizer on the CPU for every project"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "transformers>=4.57",
    "accelerate",
    # Listed so [tool.uv.sources] below can send it to the CPU-only index.
    "torch",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.40"]

[tool.uv]
package = false  # runs from src/, only the dependencies are installed

# CPU-only torch, so the CUDA/Triton wheels are never pulled (macOS has no CPU-index wheels, so it uses PyPI).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true  # runs from src/, installs only the dependencies

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
