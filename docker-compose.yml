# S1-mini service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:9220)
# Scale:  S1MINI_REPLICAS=3 docker compose up -d --build, then: docker compose restart s1mini_lb

name: s1mini

services:
  s1mini:
    build: .
    restart: unless-stopped
    mem_limit: ${S1MINI_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      S1MINI_ADMIN_PASSWORD: ${S1MINI_ADMIN_PASSWORD:-}
      S1MINI_NUM_THREAD: ${S1MINI_NUM_THREAD:-}
      S1MINI_REPLICAS: ${S1MINI_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - models:/models
      - tokens:/data
    deploy:
      replicas: ${S1MINI_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9220/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [s1mini]

  s1mini_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${S1MINI_PORT:-9220}:9220"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      s1mini:
        condition: service_healthy
    networks: [s1mini]

volumes:
  models:
  tokens:

networks:
  # Other stacks reach http://s1mini_lb:9220 by joining this network.
  s1mini:
